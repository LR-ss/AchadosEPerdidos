<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Item Perdido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='senai_2.png') }}" type="image/png">
</head>
<body>
    <header>
        <h1>Novo Item Perdido</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('perfil') }}">Perfil</a></li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form method="POST" enctype="multipart/form-data">
            <label for="nome_item">Nome do Item:</label>
            <input type="text" id="nome_item" name="nome_item" required placeholder="Informe o tipo de item. Ex: Celular, Relógio."><br><br>
            
            <label for="descricao">Descrição do Item:</label>
            <textarea id="descricao" name="descricao" required placeholder="Informe as descrições do item. Ex: Modelo, Marca, Detalhes."></textarea><br><br>
            
            <label for="lugar_encontrado">Local onde foi achado:</label>
            <input type="text" id="local_encontrado" name="local_encontrado" required placeholder="Informe onde foi achado. Ex: Bloco, Horário, Sala, Refeitório."><br><br>
            
            <label for="imagem">Foto do Item (Máximo: 3):</label>
            <input type="file" id="imagens" name="imagens" multiple accept="image/*">

            <label for="local_guardado">Onde foi guardado / Onde se encontra:</label>
            <input type="text" id="local_guardado" name="local_guardado" required placeholder="Ex: Sala da Coordenação, Achados e Perdidos, Comigo, etc.">
          
            <label>Forma de contato (e-mail ou telefone) – opcional:</label>
            <input type="text" name="contato" placeholder="ex: meu@email.com ou (XX) 9XXXX-XXXX"><br><br>
            
            <button type="submit">Cadastrar Item</button>
        </form>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
      {% endwith %}
    </main>
    <footer>
        <p>&copy; 2025 <i>SENAI</i> Search - Desenvolvido por <a href="https://linktr.ee/lucasrrenan" target="_blank"><u> Lucas Renan</u></a>. Todos os direitos reservados.</p>
      </footer>
  <script src="{{ url_for('static', filename='js/script_4.js') }}"></script>
</body>
</html>
